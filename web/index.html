<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chop sheet</title>
<meta name="description" content="Monte Carlo sims for Sleeper guillotine leagues: chop odds, lineups and FAAB bids.">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main>
<h1>chop sheet</h1>
<p>monte carlo sims for sleeper guillotine leagues. who gets chopped, what to start, what to bid.</p>

<form id="league-form">
  <input id="league-id" name="league" inputmode="numeric" autocomplete="off" placeholder="sleeper league id or url" aria-label="Sleeper league ID or URL" required>
  <button type="submit">load</button>
</form>
<div id="status" role="status" aria-live="polite"></div>

<div id="team-box" hidden>
  <select id="team" aria-label="Your team"></select>
  <button id="run" type="button" disabled>run</button>
  <p id="league-facts"></p>
  <p id="progress" hidden><progress id="progress-bar" max="1" value="0"></progress> <span id="progress-label"></span></p>
</div>

<p class="dim">guillotine + faab leagues only. no k/def, superflex, idp or best ball.<br>
<a href="https://github.com/dpasceri/fantasy-2026">source</a></p>
</main>

<section id="sheet-box" hidden>
  <p><a id="download" href="#">download sheet</a></p>
  <iframe id="sheet" title="Chop sheet"></iframe>
</section>
<script type="module" src="src/app.js"></script>
</body>
</html>
