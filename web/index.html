<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>chop sheet</title>
<meta name="description" content="Monte Carlo sims for Sleeper guillotine leagues: chop odds, lineups and FAAB bids.">
<link rel="stylesheet" href="app.css">
</head>
<body>
<main>
<h1>chop sheet</h1>

<form id="league-form">
  <div class="row">
    <input id="league-id" name="league" inputmode="numeric" autocomplete="off" placeholder="Sleeper league ID or URL" aria-label="Sleeper league ID or URL" required>
    <button type="submit">Load</button>
  </div>
</form>
<div id="status" role="status" aria-live="polite"></div>

<div id="team-box" hidden>
  <div class="row">
    <select id="team" aria-label="Your team"></select>
    <button id="run" class="go" type="button" disabled>Run</button>
  </div>
  <p id="league-facts"></p>
  <div id="progress" hidden><progress id="progress-bar" max="1" value="0"></progress><span id="progress-label"></span></div>
</div>

<p class="fine">Monte Carlo sims for Sleeper guillotine leagues with FAAB. No K/DEF, superflex, IDP or best ball. <a href="https://github.com/dpasceri/fantasy-2026">Source</a></p>
</main>

<section id="sheet-box" hidden>
  <div class="sheet-bar"><span id="run-stat"></span>
    <span id="peek-box" hidden><span id="peek-note"></span><button id="peek" type="button"></button></span>
    <a id="download" href="#">Download</a></div>
  <iframe id="sheet" title="Chop sheet"></iframe>
</section>
<script type="module" src="src/app.js"></script>
</body>
</html>
